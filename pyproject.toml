[project]
name = "home-island"
version = "0.1.0"
description = "Native Home Assistant Companion Live Activities"
requires-python = ">=3.12"
license = "MIT"

[project.urls]
Repository = "https://github.com/Ampersandman/HA-LiveActivities"
Documentation = "https://github.com/Ampersandman/HA-LiveActivities#readme"
Issues = "https://github.com/Ampersandman/HA-LiveActivities/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["custom_components/home_island/const.py", "custom_components/home_island/models.py", "custom_components/home_island/engine.py", "tools/migrate_pushward.py"]
