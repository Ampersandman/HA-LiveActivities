name: HomeIsland
options:
  bundleIdPrefix: org.example.homeisland
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
targets:
  HomeIslandModels:
    type: library.static
    platform: iOS
    sources:
      - Sources/HomeIslandModels
    settings:
      base:
        PRODUCT_MODULE_NAME: HomeIslandModels
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HomeIslandApp:
    type: application
    platform: iOS
    sources:
      - Sources/HomeIslandApp
    dependencies:
      - target: HomeIslandModels
      - target: HomeIslandWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.homeisland
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Home Island
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
  HomeIslandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HomeIslandWidgets
    dependencies:
      - target: HomeIslandModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.homeisland.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Home Island Activities
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
